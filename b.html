<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tour Management UI</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f5f5f5; margin: 0; padding: 20px; }
        h1 { text-align: center; }
        .container { max-width: 1200px; margin: auto; }
        .card { background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 20px; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        table, th, td { border: 1px solid #ccc; }
        th, td { padding: 10px; text-align: left; }
        th { background: #eee; }
        .section-title { font-size: 20px; margin-bottom: 10px; color: #333; display:flex; justify-content:space-between; align-items:center; }
        button { padding: 6px 12px; border:none; background:#007bff; color:#fff; border-radius:5px; cursor:pointer; }
        button:hover { background:#0056b3; }
        .btn-red { background:#dc3545; }
        .btn-red:hover { background:#a71d2a; }
        .modal {
            display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5);
            justify-content:center; align-items:center;
        }
        .modal-content {
            background:#fff; padding:20px; width:400px; border-radius:8px;
        }
        input, textarea { width:100%; padding:8px; margin:5px 0 10px 0; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Tour Management UI (Demo CRUD)</h1>

        <!-- Tour Categories -->
        <div class="card">
            <div class="section-title">
                Loại Tour (tour_categories)
                <button onclick="openModal('addCategoryModal')">+ Thêm</button>
            </div>
            <table>
                <tr>
                    <th>ID</th>
                    <th>Tên loại</th>
                    <th>Mô tả</th>
                    <th>Hành động</th>
                </tr>
                <tr>
                    <td>1</td>
                    <td>Tour trong nước</td>
                    <td>Khám phá các địa điểm nội địa</td>
                    <td>
                        <button onclick="openModal('editCategoryModal')">Sửa</button>
                        <button class="btn-red">Xóa</button>
                    </td>
                </tr>
            </table>
        </div>

        <!-- Add Category Modal -->
        <div class="modal" id="addCategoryModal">
            <div class="modal-content">
                <h3>Thêm loại tour</h3>
                <input type="text" placeholder="Tên loại tour">
                <textarea placeholder="Mô tả"></textarea>
                <button>Thêm</button>
                <button class="btn-red" onclick="closeModal('addCategoryModal')">Đóng</button>
            </div>
        </div>

        <!-- Edit Category Modal -->
        <div class="modal" id="editCategoryModal">
            <div class="modal-content">
                <h3>Sửa loại tour</h3>
                <input type="text" value="Tour trong nước">
                <textarea>Khám phá các địa điểm nội địa</textarea>
                <button>Lưu</button>
                <button class="btn-red" onclick="closeModal('editCategoryModal')">Đóng</button>
            </div>
        </div>

        <script>
            function openModal(id){ document.getElementById(id).style.display='flex'; }
            function closeModal(id){ document.getElementById(id).style.display='none'; }
        </script>
    </div>
</body>
</html>
